id: job_complete
name: Job Complete Closeout
goal: Close out a finished job, catch unhappy customers early, and hand happy ones to the review ask.
trigger:
  type: stage_entered
  pipeline: jobs
  stage: complete
steps:
  - id: tag_customer
    type: add_tag
    tag: customer
  - id: clear_new_lead
    type: remove_tag
    tag: new-lead
  - id: invoice_task
    type: create_task
    title: Send final invoice
    due_in: 1d
  - id: thank_you
    type: send_sms
    message: >-
      Thanks {{contact.first_name}}, your {{custom.service_type}} job is
      wrapped up. {{custom.assigned_tech}} will check in tomorrow to make sure
      everything is right.
  - id: wait_1d
    type: wait
    duration: 1d
  - id: was_unhappy
    type: condition
    name: Feedback unhappy?
    if: {field: job_satisfaction, equals: unhappy}
    then: tag_unhappy
    else: has_feedback
  - id: tag_unhappy
    type: add_tag
    tag: unhappy-customer
  - id: escalate
    type: notify_team
    message: "Unhappy customer: {{contact.first_name}} {{contact.last_name}}. Owner call today."
    next: done
  - id: has_feedback
    type: condition
    name: Feedback recorded?
    if: {field: job_satisfaction, is_set: true}
    then: tag_review_eligible
    else: feedback_task
  - id: feedback_task
    type: create_task
    title: Call customer and record job satisfaction
    due_in: 1d
    next: done
  - id: tag_review_eligible
    type: add_tag
    tag: review-eligible
  - id: done
    type: end
